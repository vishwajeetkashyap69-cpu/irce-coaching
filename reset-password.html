<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IRCE Coaching - Reset Password</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f7f2e8;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .reset-card {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px;
      border-radius: 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.12);
      text-align: center;
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: 0 auto 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5a313;
      border-radius: 18px;
      font-size: 25px;
      font-weight: bold;
      color: #075f5b;
    }

    h1 {
      color: #075f5b;
      font-size: 27px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .field {
      text-align: left;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #333;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #075f5b;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      background: #f5a313;
      color: #073f3c;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      background: #e89a08;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
    }

    .success {
      background: #e8f7ee;
      color: #18733c;
    }

    .error {
      background: #fff0ed;
      color: #c0392b;
    }

    .back {
      display: block;
      margin-top: 22px;
      color: #075f5b;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      text-decoration: underline;
    }

    .brand {
      margin-top: 22px;
      color: #888;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="reset-card">

    <div class="logo">IR</div>

    <h1>नया Password बनाएँ</h1>

    <p class="subtitle">
      अपना नया Admin Password दर्ज करें
    </p>

    <form id="resetForm">

      <div class="field">
        <label for="password">नया Password</label>

        <input
          type="password"
          id="password"
          placeholder="कम से कम 6 characters"
          minlength="6"
          required
        >
      </div>

      <div class="field">
        <label for="confirmPassword">Password दोबारा डालें</label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Password फिर से डालें"
          minlength="6"
          required
        >
      </div>

      <button type="submit" id="resetButton">
        Password बदलें →
      </button>

    </form>

    <div id="message" class="message"></div>

    <a class="back" href="admin.html">
      ← Admin Login पर वापस जाएँ
    </a>

    <div class="brand">
      © 2026 IRCE Coaching
    </div>

  </div>


<script>

  /* =========================================
     SUPABASE CONFIGURATION
     ========================================= */

  const SUPABASE_URL =
    "https://lvgpsvtzjywcyjynymux.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_-Un7Fq_wevB_CPEj6E_TZg_lX9yRE7L";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================
     ELEMENTS
     ========================================= */

  const form =
    document.getElementById("resetForm");

  const passwordInput =
    document.getElementById("password");

  const confirmPasswordInput =
    document.getElementById("confirmPassword");

  const resetButton =
    document.getElementById("resetButton");

  const message =
    document.getElementById("message");


  /* =========================================
     MESSAGE
     ========================================= */

  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display = "block";
  }


  /* =========================================
     CHECK PASSWORD RECOVERY SESSION
     ========================================= */

  supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

      console.log("Auth Event:", event);

      if (event === "PASSWORD_RECOVERY") {

        console.log(
          "Password recovery session received."
        );

      }

    }
  );


  /* =========================================
     RESET PASSWORD
     ========================================= */

  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const password =
        passwordInput.value.trim();

      const confirmPassword =
        confirmPasswordInput.value.trim();


      /* PASSWORD LENGTH */

      if (password.length < 6) {

        showMessage(
          "Password कम से कम 6 characters का होना चाहिए।",
          "error"
        );

        return;
      }


      /* PASSWORD MATCH */

      if (password !== confirmPassword) {

        showMessage(
          "दोनों Password एक जैसे नहीं हैं।",
          "error"
        );

        return;
      }


      resetButton.disabled = true;

      resetButton.textContent =
        "Password बदल रहा है...";


      try {

        /* =================================
           UPDATE PASSWORD
           ================================= */

        const { data, error } =
          await supabaseClient.auth.updateUser({
            password: password
          });


        if (error) {

          console.error(
            "Password Update Error:",
            error
          );

          showMessage(
            "Password बदलने में समस्या आई। कृपया Reset Email की नई link से दोबारा खोलें।",
            "error"
          );

          resetButton.disabled = false;

          resetButton.textContent =
            "Password बदलें →";

          return;
        }


        /* =================================
           SUCCESS
           ================================= */

        console.log(
          "Password updated successfully:",
          data
        );

        showMessage(
          "Password सफलतापूर्वक बदल दिया गया है। अब Login करें।",
          "success"
        );


        passwordInput.value = "";
        confirmPasswordInput.value = "";


        /* =================================
           GO TO ADMIN LOGIN
           ================================= */

        setTimeout(function() {

          window.location.href =
            "admin.html";

        }, 2500);


      } catch (error) {

        console.error(
          "Unexpected Error:",
          error
        );

        showMessage(
          "कुछ गलत हो गया। कृपया दोबारा कोशिश करें।",
          "error"
        );

        resetButton.disabled = false;

        resetButton.textContent =
          "Password बदलें →";
      }

    }
  );

</script>

</body>
</html>
