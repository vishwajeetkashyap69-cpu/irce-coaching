<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IRCE Coaching - Reset Password</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f7f2e8;
      color: #173f3d;
      padding: 20px;
    }

    .reset-wrapper {
      width: 100%;
      max-width: 430px;
    }

    .reset-card {
      background: #ffffff;
      padding: 40px 35px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      border: 1px solid #e8dfd2;
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: 0 auto 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 18px;
      background: #f7a415;
      color: #075f5b;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      font-size: 27px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #68807d;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d8d1c7;
      border-radius: 11px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #075f5b;
      box-shadow: 0 0 0 3px rgba(7,95,91,0.1);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 11px;
      padding: 15px;
      margin-top: 5px;
      background: #f7a415;
      color: #173f3d;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      background: #e8f7ef;
      color: #08724c;
    }

    .error {
      background: #fff0ed;
      color: #c7472f;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #075f5b;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      text-decoration: underline;
    }

    .brand {
      text-align: center;
      margin-top: 22px;
      font-size: 12px;
      color: #68807d;
    }

    @media (max-width: 480px) {
      .reset-card {
        padding: 30px 22px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="reset-wrapper">

    <div class="reset-card">

      <div class="logo">
        IR
      </div>

      <h1>नया Password बनाएँ</h1>

      <p class="subtitle">
        अपना नया Admin Password दर्ज करें
      </p>

      <form id="resetForm">

        <div class="field">

          <label for="password">
            नया Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="कम से कम 6 characters"
            minlength="6"
            autocomplete="new-password"
            required
          >

        </div>


        <div class="field">

          <label for="confirmPassword">
            Password दोबारा डालें
          </label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="Password फिर से डालें"
            minlength="6"
            autocomplete="new-password"
            required
          >

        </div>


        <button
          type="submit"
          id="resetButton"
        >
          Password बदलें →
        </button>


        <div
          id="successMessage"
          class="message success"
        ></div>


        <div
          id="errorMessage"
          class="message error"
        ></div>

      </form>


      <a
        href="admin.html"
        class="back"
      >
        ← Admin Login पर वापस जाएँ
      </a>

    </div>


    <div class="brand">
      © 2026 IRCE Coaching
    </div>

  </div>


  <script>

    /* =====================================================
       SUPABASE CONFIG
       ===================================================== */

    const SUPABASE_URL =
      "https://lvygpsvtzjywcyjnyumx.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_-Un7Fq_wevB_CPEj6E_TZg_lX9yRE7L";


    /* =====================================================
       CREATE SUPABASE CLIENT
       ===================================================== */

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const resetForm =
      document.getElementById("resetForm");

    const passwordInput =
      document.getElementById("password");

    const confirmPasswordInput =
      document.getElementById("confirmPassword");

    const resetButton =
      document.getElementById("resetButton");

    const successMessage =
      document.getElementById("successMessage");

    const errorMessage =
      document.getElementById("errorMessage");


    /* =====================================================
       MESSAGE FUNCTIONS
       ===================================================== */

    function showError(message) {

      successMessage.style.display = "none";

      errorMessage.textContent = message;

      errorMessage.style.display = "block";
    }


    function showSuccess(message) {

      errorMessage.style.display = "none";

      successMessage.textContent = message;

      successMessage.style.display = "block";
    }


    /* =====================================================
       CHECK RECOVERY SESSION
       ===================================================== */

    async function checkRecoverySession() {

      try {

        /*
         * Supabase recovery link से session automatically
         * create करने की कोशिश करेगा।
         */

        const {
          data,
          error
        } = await supabaseClient.auth.getSession();


        if (error) {

          console.error(
            "Session Error:",
            error
          );

          showError(
            "Password Reset Link valid नहीं है। कृपया नया Reset Link लें।"
          );

          return;
        }


        /*
         * अगर session नहीं मिला तो URL में recovery
         * access token मौजूद है या नहीं check करें।
         */

        const hash =
          window.location.hash;


        const hasAccessToken =
          hash.includes("access_token=");


        if (!data.session && !hasAccessToken) {

          showError(
            "यह Password Reset Link expire या invalid हो गया है। Admin Login से नया Reset Link लें।"
          );

          return;
        }


        console.log(
          "Password recovery session ready."
        );

      } catch (error) {

        console.error(
          "Recovery Check Error:",
          error
        );

      }

    }


    /* =====================================================
       PASSWORD RECOVERY EVENT
       ===================================================== */

    supabaseClient.auth.onAuthStateChange(
      async function(event, session) {

        console.log(
          "Auth Event:",
          event
        );


        if (
          event === "PASSWORD_RECOVERY"
        ) {

          console.log(
            "Password recovery session received."
          );

        }

      }
    );


    /* =====================================================
       RESET PASSWORD
       ===================================================== */

    resetForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        successMessage.style.display =
          "none";

        errorMessage.style.display =
          "none";


        const password =
          passwordInput.value;

        const confirmPassword =
          confirmPasswordInput.value;


        /* PASSWORD LENGTH */

        if (password.length < 6) {

          showError(
            "Password कम से कम 6 characters का होना चाहिए।"
          );

          return;
        }


        /* PASSWORD MATCH */

        if (
          password !== confirmPassword
        ) {

          showError(
            "दोनों Password एक जैसे नहीं हैं।"
          );

          return;
        }


        /* BUTTON LOADING */

        resetButton.disabled = true;

        resetButton.textContent =
          "Password बदला जा रहा है...";


        try {

          /* =================================================
             GET CURRENT SESSION
             ================================================= */

          const {
            data: sessionData
          } =
            await supabaseClient.auth.getSession();


          console.log(
            "Current Session:",
            sessionData.session
          );


          /*
           * अगर session नहीं है तो password update नहीं
           * किया जा सकता।
           */

          if (!sessionData.session) {

            showError(
              "Password Reset Session नहीं मिली। कृपया Gmail से नया Reset Link खोलें।"
            );

            resetButton.disabled = false;

            resetButton.textContent =
              "Password बदलें →";

            return;
          }


          /* =================================================
             UPDATE PASSWORD
             ================================================= */

          const {
            error
          } =
            await supabaseClient.auth.updateUser({

              password: password

            });


          /* UPDATE ERROR */

          if (error) {

            console.error(
              "Password Update Error:",
              error
            );


            showError(
              "Password बदलने में समस्या आई: " +
              error.message
            );


            resetButton.disabled = false;

            resetButton.textContent =
              "Password बदलें →";

            return;
          }


          /* =================================================
             SUCCESS
             ================================================= */

          showSuccess(
            "Password सफलतापूर्वक बदल गया! अब Admin Login करें।"
          );


          resetButton.disabled = true;

          resetButton.textContent =
            "Password बदल गया ✓";


          passwordInput.value = "";

          confirmPasswordInput.value = "";


          /* =================================================
             GO TO LOGIN
             ================================================= */

          setTimeout(
            function() {

              window.location.href =
                "admin.html";

            },
            2000
          );


        } catch (error) {

          console.error(
            "Unexpected Error:",
            error
          );


          showError(
            "कुछ समस्या हुई। कृपया फिर से कोशिश करें।"
          );


          resetButton.disabled = false;

          resetButton.textContent =
            "Password बदलें →";

        }

      }
    );


    /* =====================================================
       START
       ===================================================== */

    checkRecoverySession();

  </script>

</body>
</html>
