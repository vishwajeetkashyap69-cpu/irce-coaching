<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IRCE Coaching - Reset Password</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f7f2e8;
      color: #173f3d;
      padding: 20px;
    }

    .reset-wrapper {
      width: 100%;
      max-width: 430px;
    }

    .reset-card {
      background: #ffffff;
      border-radius: 22px;
      padding: 35px 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.12);
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: 0 auto 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 18px;
      background: #f7a415;
      color: #173f3d;
      font-size: 25px;
      font-weight: 800;
    }

    h1 {
      text-align: center;
      font-size: 27px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #68807d;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #d9d2c8;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #075f5b;
      box-shadow: 0 0 0 3px rgba(7,95,91,0.1);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      background: #f7a415;
      color: #173f3d;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      background: #fff0ed;
      color: #d93025;
    }

    .success {
      background: #edf8f1;
      color: #18864b;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #075f5b;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      text-decoration: underline;
    }

    .brand {
      text-align: center;
      margin-top: 25px;
      color: #68807d;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .reset-card {
        padding: 30px 22px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="reset-wrapper">

    <div class="reset-card">

      <div class="logo">IR</div>

      <h1>नया Password बनाएं</h1>

      <p class="subtitle">
        अपना नया Admin Password दर्ज करें
      </p>

      <form id="resetForm">

        <div class="field">
          <label for="password">नया Password</label>

          <input
            type="password"
            id="password"
            placeholder="नया Password डालें"
            minlength="6"
            required
          >
        </div>

        <div class="field">
          <label for="confirmPassword">Password दोबारा डालें</label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="Password फिर से डालें"
            minlength="6"
            required
          >
        </div>

        <button type="submit" id="resetButton">
          Password बदलें →
        </button>

      </form>

      <div
        id="errorMessage"
        class="message error">
      </div>

      <div
        id="successMessage"
        class="message success">
      </div>

      <a
        class="back"
        href="admin.html">
        ← Admin Login पर वापस जाएँ
      </a>

    </div>

    <div class="brand">
      © 2026 IRCE Coaching
    </div>

  </div>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /* =========================================
       SUPABASE CONFIGURATION
       ========================================= */

    const SUPABASE_URL =
      "https://lvygpsvtzjywcyjnyumx.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_-Un7Fq_wevB_CPEj6E_TZg_lX9yRE7L";


    /* =========================================
       CREATE SUPABASE CLIENT
       ========================================= */

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================
       ELEMENTS
       ========================================= */

    const resetForm =
      document.getElementById("resetForm");

    const passwordInput =
      document.getElementById("password");

    const confirmPasswordInput =
      document.getElementById("confirmPassword");

    const resetButton =
      document.getElementById("resetButton");

    const errorMessage =
      document.getElementById("errorMessage");

    const successMessage =
      document.getElementById("successMessage");


    /* =========================================
       SHOW ERROR
       ========================================= */

    function showError(message) {

      errorMessage.textContent = message;
      errorMessage.style.display = "block";

      successMessage.style.display = "none";
    }


    /* =========================================
       SHOW SUCCESS
       ========================================= */

    function showSuccess(message) {

      successMessage.textContent = message;
      successMessage.style.display = "block";

      errorMessage.style.display = "none";
    }


    /* =========================================
       CHECK PASSWORD RECOVERY SESSION
       ========================================= */

    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {

        console.log("Auth Event:", event);

        if (event === "PASSWORD_RECOVERY") {

          console.log(
            "Password recovery session received."
          );

        }

      }
    );


    /* =========================================
       RESET PASSWORD
       ========================================= */

    resetForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        errorMessage.style.display = "none";
        successMessage.style.display = "none";

        const password =
          passwordInput.value;

        const confirmPassword =
          confirmPasswordInput.value;


        /* PASSWORD LENGTH */

        if (password.length < 6) {

          showError(
            "Password कम से कम 6 characters का होना चाहिए।"
          );

          return;
        }


        /* PASSWORD MATCH */

        if (password !== confirmPassword) {

          showError(
            "दोनों Password एक जैसे नहीं हैं।"
          );

          return;
        }


        resetButton.disabled = true;

        resetButton.textContent =
          "Password बदला जा रहा है...";


        try {

          /* ==============================
             UPDATE PASSWORD
             ============================== */

          const { data, error } =
            await supabaseClient.auth.updateUser({
              password: password
            });


          /* ERROR */

          if (error) {

            console.error(
              "Password Update Error:",
              error
            );

            showError(
              "Password बदलने में समस्या आई। कृपया Reset Email का नया link खोलें।"
            );

            resetButton.disabled = false;

            resetButton.textContent =
              "Password बदलें →";

            return;
          }


          /* SUCCESS */

          console.log(
            "Password updated:",
            data
          );

          showSuccess(
            "Password सफलतापूर्वक बदल दिया गया है।"
          );


          resetForm.style.display = "none";


          /* GO TO LOGIN */

          setTimeout(function() {

            window.location.href =
              "admin.html";

          }, 2000);


        } catch (error) {

          console.error(
            "Unexpected Error:",
            error
          );

          showError(
            "कुछ गलत हो गया। कृपया दोबारा कोशिश करें।"
          );

          resetButton.disabled = false;

          resetButton.textContent =
            "Password बदलें →";
        }

      }
    );

  </script>

</body>
</html>
