<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IRCE Coaching — Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f7f2e8;
      color: #173f3d;
    }

    .login-wrapper {
      width: 100%;
      max-width: 430px;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 40px 35px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
      border: 1px solid #e8dfd2;
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: #f7a415;
      color: #075f5b;
      font-size: 25px;
      font-weight: 800;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #68807d;
      font-size: 14px;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #d9d2c8;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #075f5b;
      box-shadow: 0 0 0 3px rgba(7, 95, 91, 0.1);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      background: #f7a415;
      color: #173f3d;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .loading {
      display: none;
      margin-top: 12px;
      text-align: center;
      color: #68807d;
      font-size: 13px;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #fff0ed;
      color: #c7472f;
      font-size: 14px;
      text-align: center;
      line-height: 1.5;
    }

    .success {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #eaf7f2;
      color: #075f5b;
      font-size: 14px;
      text-align: center;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #075f5b;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      text-decoration: underline;
    }

    .brand {
      text-align: center;
      margin-top: 25px;
      font-size: 12px;
      color: #68807d;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 22px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="login-wrapper">

    <div class="login-card">

      <div class="logo">
        IR
      </div>

      <h1>Admin Login</h1>

      <p class="subtitle">
        IRCE Coaching Administration Panel
      </p>

      <form id="loginForm">

        <!-- ADMIN EMAIL -->
        <div class="field">

          <label for="email">
            Admin Email
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="अपना Admin Email डालें"
            autocomplete="username"
            required
          >

        </div>


        <!-- PASSWORD -->
        <div class="field">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="अपना Password डालें"
            autocomplete="current-password"
            required
          >

        </div>


        <!-- LOGIN BUTTON -->
        <button
          type="submit"
          id="loginButton"
        >
          Login करें →
        </button>


        <!-- LOADING -->
        <div
          class="loading"
          id="loadingMessage"
        >
          Login हो रहा है...
        </div>


        <!-- ERROR -->
        <div
          class="error"
          id="errorMessage"
        >
          Email या Password गलत है।
        </div>


        <!-- SUCCESS -->
        <div
          class="success"
          id="successMessage"
        >
          Login सफल! Dashboard खोला जा रहा है...
        </div>

      </form>


      <!-- BACK TO WEBSITE -->
      <a
        href="index.html"
        class="back"
      >
        ← मुख्य वेबसाइट पर वापस जाएँ
      </a>

    </div>


    <div class="brand">
      © 2026 IRCE Coaching
    </div>

  </div>


  <!-- =====================================================
       SUPABASE LIBRARY
       ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* =====================================================
       SUPABASE CONFIGURATION
       ===================================================== */

    const SUPABASE_URL =
      "https://lvygpsvtzjywcyjnyumx.supabase.co";


    /*
       अभी Publishable Key नहीं डालनी है।

       बाद में यहाँ अपनी Supabase Publishable Key डालना:

       const SUPABASE_KEY = "sb_publishable_xxxxxxxxx";

       IMPORTANT:
       यहाँ Secret Key या service_role key बिल्कुल नहीं डालनी।
    */

    const SUPABASE_KEY =
      "YOUR_PUBLISHABLE_KEY_HERE";


    /* =====================================================
       CREATE SUPABASE CLIENT
       ===================================================== */

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================================
       GET HTML ELEMENTS
       ===================================================== */

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const loadingMessage =
      document.getElementById("loadingMessage");

    const errorMessage =
      document.getElementById("errorMessage");

    const successMessage =
      document.getElementById("successMessage");


    /* =====================================================
       LOGIN FUNCTION
       ===================================================== */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        /* Hide old messages */

        errorMessage.style.display = "none";

        successMessage.style.display = "none";


        /* Get email and password */

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        /* Check empty fields */

        if (!email || !password) {

          errorMessage.textContent =
            "Email और Password दोनों भरें।";

          errorMessage.style.display =
            "block";

          return;
        }


        /* Start loading */

        loginButton.disabled = true;

        loadingMessage.style.display =
          "block";


        try {

          /* =================================================
             SUPABASE LOGIN
             ================================================= */

          const {
            data,
            error: loginError
          } =
            await supabaseClient.auth.signInWithPassword({

              email: email,

              password: password

            });


          /* Stop loading */

          loginButton.disabled = false;

          loadingMessage.style.display =
            "none";


          /* =================================================
             LOGIN ERROR
             ================================================= */

          if (loginError) {

            console.error(
              "Supabase Login Error:",
              loginError
            );

            errorMessage.textContent =
              "Email या Password गलत है।";

            errorMessage.style.display =
              "block";

            return;
          }


          /* =================================================
             LOGIN SUCCESS
             ================================================= */

          if (data && data.user) {

            successMessage.textContent =
              "Login सफल! Dashboard खोला जा रहा है...";

            successMessage.style.display =
              "block";


            /* Open Admin Dashboard */

            setTimeout(function() {

              window.location.href =
                "admin-dashboard.html";

            }, 700);

          } else {

            errorMessage.textContent =
              "Login सफल नहीं हुआ। कृपया फिर से कोशिश करें।";

            errorMessage.style.display =
              "block";
          }

        } catch (error) {

          /* =================================================
             UNEXPECTED ERROR
             ================================================= */

          console.error(
            "Unexpected Login Error:",
            error
          );


          loginButton.disabled = false;

          loadingMessage.style.display =
            "none";


          errorMessage.textContent =
            "Login में समस्या आई। कृपया दोबारा कोशिश करें।";

          errorMessage.style.display =
            "block";
        }

      }
    );

  </script>

</body>
</html>
