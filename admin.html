
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IRCE Coaching — Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f7f2e8;
      color: #173f3d;
    }

    .login-wrapper {
      width: 100%;
      max-width: 430px;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 40px 35px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
      border: 1px solid #e8dfd2;
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: #f7a415;
      color: #075f5b;
      font-size: 25px;
      font-weight: 800;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #68807d;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #d9d2c8;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #075f5b;
      box-shadow: 0 0 0 3px rgba(7, 95, 91, 0.1);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      background: #f7a415;
      color: #173f3d;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #fff0ed;
      color: #c7472f;
      font-size: 14px;
      text-align: center;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #075f5b;
      text-decoration: none;
      font-size: 14px;
    }

    .brand {
      text-align: center;
      margin-top: 25px;
      font-size: 12px;
      color: #68807d;
    }
  </style>
</head>

<body>

  <div class="login-wrapper">

    <div class="login-card">

      <div class="logo">IR</div>

      <h1>Admin Login</h1>

      <p class="subtitle">
        IRCE Coaching Administration Panel
      </p>

      <form id="loginForm">

        <div class="field">
          <label for="username">Admin Username</label>
          <input
            type="text"
            id="username"
            placeholder="Username दर्ज करें"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Password दर्ज करें"
            required
          >
        </div>

        <button type="submit">
          Login करें →
        </button>

        <div class="error" id="errorMessage">
          Username या Password गलत है।
        </div>

      </form>

      <a href="index.html" class="back">
        ← मुख्य वेबसाइट पर वापस जाएँ
      </a>

    </div>

    <div class="brand">
      © 2026 IRCE Coaching
    </div>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const error = document.getElementById("errorMessage");

      /*
        Temporary login for development.
        इसे बाद में secure authentication से replace करेंगे.
      */

      if (username === "admin" && password === "IRCE@2026") {

        sessionStorage.setItem("irceAdminLoggedIn", "true");

        window.location.href = "admin-dashboard.html";

      } else {

        error.style.display = "block";

      }
    });
  </script>

</body>
</html>
