<div class="panel">
    <h2>Applications</h2>

    <div class="tablewrap">
        <table>
            <thead>
                <tr>
                    <th>Photo</th>
                    <th>Application</th>
                    <th>Student</th>
                    <th>Mobile</th>
                    <th>Class</th>
                    <th>Course</th>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody>

                {% for a in applications %}

                <tr>

                    <!-- Student Photo -->
                    <td>
                        {% if a.photo %}
                            <img
                                src="{{ url_for('static', filename='uploads/' + a.photo) }}"
                                alt="Student Photo"
                                class="student-photo"
                            >
                        {% else %}
                            <div class="no-photo">
                                👤
                            </div>
                        {% endif %}
                    </td>

                    <!-- Application Number -->
                    <td>
                        <a href="{{ url_for('application_status', application_no=a.application_no) }}">
                            {{ a.application_no }}
                        </a>
                    </td>

                    <!-- Student Name -->
                    <td>
                        <strong>{{ a.name }}</strong>
                    </td>

                    <!-- Mobile -->
                    <td>{{ a.mobile }}</td>

                    <!-- Class -->
                    <td>{{ a.class_name or '-' }}</td>

                    <!-- Course -->
                    <td>{{ a.course or '-' }}</td>

                    <!-- Date -->
                    <td>{{ a.created_at }}</td>

                    <!-- Status -->
                    <td>
                        <form
                            method="post"
                            action="{{ url_for('status', app_id=a.id) }}"
                        >

                            <select
                                name="status"
                                onchange="this.form.submit()"
                            >

                                {% for s in ['New','Contacted','Selected','Rejected'] %}

                                <option
                                    {% if a.status == s %}
                                    selected
                                    {% endif %}
                                >
                                    {{ s }}
                                </option>

                                {% endfor %}

                            </select>

                        </form>
                    </td>

                </tr>

                {% endfor %}

            </tbody>
        </table>
    </div>
</div>
